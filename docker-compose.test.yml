services:
  database_test:
    image: postgres:16-alpine
    container_name: document-ai-db-test
    env_file:                  # <- APONTA PARA O ARQUIVO DE TESTE
      - .env.test
    ports:
      - "5433:5432"
    healthcheck:
      # Opcional: Você pode deixar hardcoded como estava, ou usar 
      # as próprias variáveis do container para ficar dinâmico:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 5