services:
  database_test:
    image: pgvector/pgvector:pg16
    container_name: document-ai-db-test
    env_file:                 
      - .env.test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 5