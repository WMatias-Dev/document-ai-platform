services:
  database_test:
    image: postgres:16-alpine
    container_name: document-ai-db-test

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: documents_test

    ports:
      - "5433:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d documents_test"]
      interval: 3s
      timeout: 3s
      retries: 5